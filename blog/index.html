<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tyler Richman — Photography Journal</title>
  <meta name="description" content="A minimal photo journal documenting moments, places, and thoughts." />
  <style>
    :root{
      --bg:#000000;
      --paper:#06070b;
      --ink:#f5f7ff;
      --muted:rgba(245,247,255,.62);
      --line:rgba(255,255,255,.08);
      --shadow:0 20px 50px rgba(0,0,0,.75);
      --radius:18px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      color:var(--ink);
      line-height:1.6;
      background:
        radial-gradient(800px 420px at 20% 0%, rgba(255,255,255,.04), transparent 60%),
        radial-gradient(700px 380px at 80% 20%, rgba(255,255,255,.035), transparent 60%),
        var(--bg);
    }

    a{ color:inherit; text-decoration:none; }

    .wrap{
      max-width:1000px;
      margin:0 auto;
      padding:64px 22px 80px;
    }

    header{
      margin-bottom:64px;
    }

    header h1{
      font-size:36px;
      margin:0 0 16px;
      font-weight:400;
      letter-spacing:.4px;
    }

    header p{
      margin:0;
      color:var(--muted);
      max-width:62ch;
    }

    .posts{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:32px;
    }

    .post{
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      padding:30px 26px 32px;
      background: var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      min-height: 240px;
    }

    /* Background image layer */
    .post.has-img::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: var(--bgimg);
      background-size: cover;
      background-position: center;
      filter: grayscale(.05) saturate(1.05) contrast(1.1) brightness(.75);
      transform: scale(1.05);
    }

    /* Heavy cinematic overlay */
    .post::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.78) 70%, rgba(0,0,0,.9)),
        radial-gradient(900px 300px at 50% 0%, rgba(255,255,255,.05), transparent 60%);
      pointer-events:none;
    }

    .post > *{ position:relative; z-index:1; }

    .post:hover{
      transform: translateY(-6px);
      box-shadow:0 26px 70px rgba(0,0,0,.85);
      border-color: rgba(255,255,255,.14);
    }

    .date{
      font-size:13px;
      color:rgba(245,247,255,.70);
      margin-bottom:12px;
    }

    .title{
      margin:0;
      font-size:23px;
      font-weight:400;
      text-shadow: 0 3px 14px rgba(0,0,0,.6);
    }

    .desc{
      margin:12px 0 0;
      color:rgba(245,247,255,.78);
      max-width:55ch;
      text-shadow: 0 3px 14px rgba(0,0,0,.6);
    }

    footer{
      margin-top:72px;
      padding-top:32px;
      border-top:1px solid var(--line);
      font-size:14px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:12px;
    }

    @media (max-width:900px){
      .posts{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tyler Richman's Photography Journal</h1>
      <p>
        Coming soon...
        <!--A quiet photo journal — short reflections from walks, trips, and moments that felt worth remembering.-->
      </p>
    </header>

    <main class="posts" id="posts"></main>

    <footer>
      <div>© <span id="year"></span> Tyler Richman's Photography Journal </div>
    </footer>
  </div>

  <script>
    const posts = [
      {
        title: "My Journey Into Photography",
        date: "Coming Soon...", //2026-01-20
        desc: "Coming soon...",
        href: "../coming_soon/index.html",
        img: "./img/coming_soon.jpg"
      }
    ];

    const container = document.getElementById('posts');
    const year = document.getElementById('year');
    year.textContent = new Date().getFullYear();

    function render(){
      posts
        .sort((a,b) => a.date < b.date ? 1 : -1)
        .forEach(p => {
          const a = document.createElement('a');
          a.className = 'post';

          // Optional card background image
          if (p.img){
            a.classList.add('has-img');
            a.style.setProperty('--bgimg', `url('${p.img}')`);
          }
          a.href = p.href;
          if (p.img){ a.style.backgroundImage = `url('${p.img}')`; }

          const date = document.createElement('div');
          date.className = 'date';
          date.textContent = new Date(p.date + 'T00:00:00').toLocaleDateString(undefined, {
            year:'numeric', month:'short', day:'numeric'
          });

          const title = document.createElement('h2');
          title.className = 'title';
          title.textContent = p.title;

          const desc = document.createElement('p');
          desc.className = 'desc';
          desc.textContent = p.desc;

          a.append(date, title, desc);
          container.appendChild(a);
        });
    }

    render();
  </script>
</body>
</html>
